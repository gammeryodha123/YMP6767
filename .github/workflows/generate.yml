name: Auto-Generate Project Files

on:
  workflow_dispatch: # Allows you to trigger it manually from GitHub
  push:
    paths:
      - 'generate_project.py' # Runs automatically whenever generate_project.py is updated

jobs:
  generate-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit and push back to the repository

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run generator script
        run: python generate_project.py

      - name: Commit and push created files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app.py requirements.txt Procfile
          git diff --staged --quiet || git commit -m "Auto-generate app.py, requirements.txt, and Procfile"
          git push
          
